name: CI (testes e qualidade)

# Roda a cada envio de código e em pull requests — antes era só na hora de
# gerar a release. Se algo quebrar, o GitHub avisa na hora.
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyflakes

      - name: Verificar sintaxe de todos os arquivos Python
        run: python -m compileall -q main.py core features integrations services repositories tests

      - name: Procurar erros comuns (nomes indefinidos, imports quebrados)
        run: |
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run(
              [sys.executable, "-m", "pyflakes", "main.py", "core", "features", "integrations", "services", "repositories"],
              capture_output=True, text=True,
          ).stdout
          # Só falha em problemas graves; avisos de estilo são ignorados.
          serious = [l for l in out.splitlines() if "undefined name" in l or "syntax" in l.lower()]
          print(out)
          if serious:
              print("\nProblemas graves:\n" + "\n".join(serious))
              sys.exit(1)
          PY

      - name: Verificar arquivos de tela (.kv)
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path("ui").rglob("*.kv"):
              t = p.read_text("utf-8")
              if "\t" in t:
                  bad.append(f"{p}: usa TAB (Kivy exige espaços)")
          print("\n".join(bad) or "KV ok")
          sys.exit(1 if bad else 0)
          PY

      - name: Rodar testes automáticos
        run: python -m unittest discover -s tests -v
