name: Teste no emulador Android (APK publicado)

# Roda só quando você manda (Actions > este workflow > Run workflow).
# Baixa o APK da release escolhida, instala em emuladores Android 10, 14, 16 e 17,
# abre o app e confere se ele continua aberto e sem erro Python no log.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (vazio = última)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Itens marcados como experimental podem falhar sem reprovar o teste todo.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            channel: stable
            experimental: false
            ram: 2048M
            boot-timeout: 600
          - api-level: 34
            channel: stable
            experimental: false
            ram: 2048M
            boot-timeout: 600
          - api-level: 36
            channel: stable
            experimental: false
            ram: 2048M
            boot-timeout: 600
          # No Android 17 o Google chama a versão de "37.0" (não só "37").
          # Android 17 é mais pesado: mais memória e mais tempo para ligar.
          # Fica como experimental: se o emulador dele não ligar no GitHub,
          # não reprova os outros testes.
          - api-level: '37.0'
            channel: stable
            experimental: true
            ram: 4096M
            boot-timeout: 900
    steps:
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Baixar APK da release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir apk
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.apk' -D apk
          else
            gh release download -R "$GITHUB_REPOSITORY" -p '*.apk' -D apk
          fi
          ls -lh apk

      - name: Instalar, abrir e verificar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          channel: ${{ matrix.channel }}
          cores: 4
          ram-size: ${{ matrix.ram }}
          disk-size: 6G
          emulator-boot-timeout: ${{ matrix.boot-timeout }}
          script: |
            set -e; APK=$(ls apk/*.apk | head -1); PKG=org.erick.tibiatools; adb logcat -c; adb install -r "$APK"; adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1; sleep 40; adb shell pidof $PKG || (echo "APP FECHOU"; adb logcat -d | tail -300; exit 1); adb logcat -d > logcat.txt; echo "App continuou aberto"

      - name: Procurar erros Python no log
        run: |
          python3 - logcat.txt <<'PYEOF'
          """Procura erros Python reais no logcat do teste de emulador.

          Ignora o aviso inofensivo do Kivy ao copiar seus ícones para .kivy/icon
          (o próprio Kivy trata esse erro e o app continua normalmente).
          """
          import re
          import sys

          HARMLESS = ("kivy-icon", ".kivy/icon")

          text = open(sys.argv[1] if len(sys.argv) > 1 else "logcat.txt", errors="ignore").read()
          parts = re.split(r"Traceback \(most recent call last\):", text)
          real = []
          for block in parts[1:]:
              lines = block.splitlines()[:40]
              chunk = "\n".join(lines)
              if any(h in chunk for h in HARMLESS):
                  continue
              real.append(chunk)

          if real:
              for chunk in real:
                  print("Traceback (most recent call last):")
                  print(chunk)
                  print("-" * 60)
              print(f"ERRO: {len(real)} erro(s) Python encontrado(s)")
              sys.exit(1)
          print(f"OK: app aberto e sem erro Python ({len(parts) - 1} aviso(s) inofensivo(s) ignorado(s))")
          PYEOF

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-api-${{ matrix.api-level }}
          path: logcat.txt
          if-no-files-found: ignore
